name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub release (uncheck for full dry run)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip the test job (dry runs only)"
        required: false
        default: false
        type: boolean
      # Build checkboxes: unchecking any is for dry runs only, and release
      # preparation runs only when all are checked.
      build_darwin:
        description: "Build macOS (arm64 and amd64)"
        required: false
        default: true
        type: boolean
      build_windows_amd64:
        description: "Build Windows amd64"
        required: false
        default: true
        type: boolean
      build_windows_arm64:
        description: "Build Windows arm64"
        required: false
        default: true
        type: boolean
      build_linux_amd64:
        description: "Build Linux amd64"
        required: false
        default: true
        type: boolean
      build_linux_arm64:
        description: "Build Linux arm64"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v[1-9]*"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      complete: ${{ steps.plan.outputs.complete }}
    steps:
      - name: Select builds
        id: plan
        env:
          PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.release == 'true' }}
          SKIP_TESTS: ${{ github.event.inputs.skip_tests == 'true' }}
          # Null on tag pushes, which always build everything.
          INPUTS: ${{ toJSON(github.event.inputs) }}
          # Each build runs unless its "input" checkbox is unchecked.
          BUILDS: |
            [
              {
                "runner": "macos-latest",
                "goos": "darwin",
                "arch": "arm64-and-amd64",
                "input": "build_darwin",
                "artifact_name": "artifacts-darwin",
                "artifact_path": "bin/*-macos-*.dmg\nbin/*-darwin-*.zip"
              },
              {
                "runner": "windows-latest",
                "goos": "windows",
                "arch": "amd64",
                "input": "build_windows_amd64",
                "artifact_name": "artifacts-windows-amd64",
                "artifact_path": "bin/*-windows-amd64.exe\nbin/*-windows-amd64-user-installer.exe\nbin/*-windows-amd64-system-installer.exe"
              },
              {
                "runner": "windows-11-arm",
                "goos": "windows",
                "arch": "arm64",
                "input": "build_windows_arm64",
                "artifact_name": "artifacts-windows-arm64",
                "artifact_path": "bin/*-windows-arm64.exe\nbin/*-windows-arm64-user-installer.exe\nbin/*-windows-arm64-system-installer.exe"
              },
              {
                "runner": "ubuntu-latest",
                "goos": "linux",
                "arch": "amd64",
                "input": "build_linux_amd64",
                "artifact_name": "artifacts-linux-amd64",
                "artifact_path": "bin/*.deb\nbin/*.rpm\nbin/*-linux-*.tar.gz"
              },
              {
                "runner": "ubuntu-latest-arm",
                "goos": "linux",
                "arch": "arm64",
                "input": "build_linux_arm64",
                "artifact_name": "artifacts-linux-arm64",
                "artifact_path": "bin/*.deb\nbin/*.rpm\nbin/*-linux-*.tar.gz"
              }
            ]
        run: |
          matrix="$(jq -c --argjson inputs "$INPUTS" \
            '{include: [.[] | select((($inputs // {})[.input] | tostring) != "false")]}' \
            <<<"$BUILDS")"
          selected="$(jq '.include | length' <<<"$matrix")"
          complete="$([ "$selected" -eq "$(jq length <<<"$BUILDS")" ] && echo true || echo false)"
          if [ "$PUBLISH" = "true" ] && { [ "$complete" != "true" ] || [ "$SKIP_TESTS" = "true" ]; }; then
            echo "::error::A published release must run the tests and every build."
            exit 1
          fi
          if [ "$selected" -eq 0 ]; then
            echo "::error::Select at least one build."
            exit 1
          fi
          {
            echo "matrix=$matrix"
            echo "complete=$complete"
          } >> "$GITHUB_OUTPUT"

  test:
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    runs-on: ubuntu-latest #-32core-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Validate release tag
        if: ${{ github.event_name == 'push' || github.event.inputs.release == 'true' }}
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: go run ./cmd/project validate-release-tag

      - name: Run tests
        run: |
          echo "🟣 Run a build to ensure frontend/dist is generated"
          wails3 build
          echo "🟣 Run backend vet"
          wails3 task qc:vet
          echo "🟣 Run backend tests"
          # Wails' Linux single-instance check requires a session bus.
          dbus-run-session -- wails3 task test:backend
          echo "🟣 Run frontend lint"
          wails3 task qc:lint
          echo "🟣 Run frontend typecheck"
          wails3 task qc:typecheck
          echo "🟣 Run frontend tests"
          wails3 task test:frontend

  build:
    needs:
      - plan
      - test
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      actions: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_BACKEND_DSN: ${{ secrets.SENTRY_BACKEND_DSN }}
      SENTRY_FRONTEND_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
      SENTRY_FRONTEND_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      # Releases use the trusted certificate and need approval in SignPath;
      # dry runs use the test certificate and are signed without approval.
      SIGNPATH_SIGNING_POLICY: ${{ (github.event_name == 'push' || github.event.inputs.release == 'true') && 'release-signing' || 'test-signing' }}
    strategy:
      # Don't fail the whole build if one matrix job fails.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.goos }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: ${{ matrix.goos == 'linux' }}

      - name: Set up macOS code signing
        if: matrix.goos == 'darwin'
        id: macos_signing
        uses: ./.github/actions/macos-signing
        with:
          macos_certificate: ${{ secrets.MACOS_CERTIFICATE }}
          macos_certificate_pwd: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Install Windows dependencies
        if: matrix.goos == 'windows'
        uses: ./.github/actions/install-nsis

      - name: Create package for macOS (signed and notarized)
        if: matrix.goos == 'darwin'
        env:
          MACOS_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.macos_identity }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PRODUCT_NAME="$(go run ./cmd/project product-name)"
          APP_BUNDLE="bin/${APP_PRODUCT_NAME}.app"
          APP_DMG="bin/${APP_PRODUCT_NAME}.dmg"

          xcrun notarytool store-credentials luxury-yacht-ci \
            --apple-id "$MACOS_APPLE_ID" \
            --team-id "$MACOS_APPLE_TEAM_ID" \
            --password "$MACOS_APPLE_APP_PASSWORD"

          wails3 task darwin:package ARCH=arm64
          wails3 tool sign \
            --input "$APP_BUNDLE" \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --notarize \
            --keychain-profile luxury-yacht-ci
          codesign --verify --deep --strict "$APP_BUNDLE"
          spctl --assess --type execute "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"
          wails3 task darwin:create:updater-archive ARCH=arm64
          UPDATER_ARTIFACT="bin/$(GOOS=darwin GOARCH=arm64 RELEASE_FORMAT=updater go run ./cmd/project release-artifact-name)" GOARCH=arm64 wails3 task release:validate-macos-updater
          wails3 task darwin:create:dmg
          mv "$APP_DMG" "bin/$(GOOS=darwin GOARCH=arm64 RELEASE_FORMAT=dmg go run ./cmd/project release-artifact-name)"

          wails3 task darwin:package ARCH=amd64
          wails3 tool sign \
            --input "$APP_BUNDLE" \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --notarize \
            --keychain-profile luxury-yacht-ci
          codesign --verify --deep --strict "$APP_BUNDLE"
          spctl --assess --type execute "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"
          wails3 task darwin:create:updater-archive ARCH=amd64
          UPDATER_ARTIFACT="bin/$(GOOS=darwin GOARCH=amd64 RELEASE_FORMAT=updater go run ./cmd/project release-artifact-name)" GOARCH=amd64 wails3 task release:validate-macos-updater
          wails3 task darwin:create:dmg
          mv "$APP_DMG" "bin/$(GOOS=darwin GOARCH=amd64 RELEASE_FORMAT=dmg go run ./cmd/project release-artifact-name)"

      - name: Create package for Linux
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          wails3 task linux:build ARCH=${{ matrix.arch }}
          wails3 task linux:generate:deb ARCH=${{ matrix.arch }}
          wails3 task linux:generate:rpm ARCH=${{ matrix.arch }}
          wails3 task linux:generate:portable ARCH=${{ matrix.arch }}
          UPDATER_ARTIFACT="bin/$(GOOS=linux GOARCH=${{ matrix.arch }} RELEASE_FORMAT=updater go run ./cmd/project release-artifact-name)" GOARCH=${{ matrix.arch }} wails3 task release:validate-linux-updater

      - name: Build Windows executable
        if: matrix.goos == 'windows'
        run: |
          # Fail on any failing command, not just the last one the runner checks.
          $PSNativeCommandUseErrorActionPreference = $true
          go test ./internal/updatetemp ./internal/updateidentity ./internal/windowsinstall ./backend -run Windows -count=1
          wails3 task windows:build ARCH=${{ matrix.arch }}
          $config = go run ./cmd/project config | ConvertFrom-Json
          "APP_VERSION=$($config.version)" >> $env:GITHUB_ENV
          "WINDOWS_EXECUTABLE_NAME=$(go run ./cmd/project binary-name).exe" >> $env:GITHUB_ENV

      - name: Upload unsigned Windows executable for signing
        if: matrix.goos == 'windows'
        id: unsigned_windows_executable
        uses: actions/upload-artifact@v7
        with:
          name: signpath-windows-executable-${{ matrix.arch }}
          path: bin/${{ env.WINDOWS_EXECUTABLE_NAME }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Sign Windows executable
        if: matrix.goos == 'windows'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: app
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.unsigned_windows_executable.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/windows-executable
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}

      - name: Create package for Windows
        if: matrix.goos == 'windows'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item -LiteralPath "signed/windows-executable/$env:WINDOWS_EXECUTABLE_NAME" -Destination "bin/$env:WINDOWS_EXECUTABLE_NAME" -Force
          wails3 task windows:package:from-built ARCH=${{ matrix.arch }}
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          $env:WINDOWS_ARCH = "${{ matrix.arch }}"
          $env:RELEASE_FORMAT = "updater"
          $env:UPDATER_ARTIFACT = "bin/$(go run ./cmd/project release-artifact-name)"
          wails3 task release:validate-windows-updater
          $config = go run ./cmd/project config | ConvertFrom-Json
          $userInstaller = Get-ChildItem "bin/*-windows-${{ matrix.arch }}-user-installer.exe" -File -ErrorAction Stop
          if ($userInstaller.Count -ne 1) { throw "Expected exactly one Windows user installer" }
          $systemInstaller = Get-ChildItem "bin/*-windows-${{ matrix.arch }}-system-installer.exe" -File -ErrorAction Stop
          if ($systemInstaller.Count -ne 1) { throw "Expected exactly one Windows system installer" }
          ./build/windows/package-drill.ps1 -UserInstaller $userInstaller.FullName -SystemInstaller $systemInstaller.FullName -ExpectedVersion $config.version -ProductName $config.productName -UninstallRegistryPath $config.windowsUninstallRegistryPath

      - name: Upload unsigned Windows installers for signing
        if: matrix.goos == 'windows'
        id: unsigned_windows_installers
        uses: actions/upload-artifact@v7
        with:
          name: signpath-windows-installers-${{ matrix.arch }}
          path: bin/*-windows-${{ matrix.arch }}-*-installer.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Sign Windows installers
        if: matrix.goos == 'windows'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: app
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.unsigned_windows_installers.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/windows-installers
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}

      - name: Verify Windows signatures
        if: matrix.goos == 'windows'
        run: |
          Copy-Item -Path "signed/windows-installers/*-installer.exe" -Destination bin -Force
          $files = @(Get-ChildItem "bin/*-windows-${{ matrix.arch }}.exe", "bin/*-windows-${{ matrix.arch }}-*-installer.exe" -File)
          if ($files.Count -ne 3) { throw "Expected the updater executable and two installers, found $($files.Count)" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($null -eq $signature.SignerCertificate) { throw "$($file.Name) is not signed" }
            # The test certificate is untrusted, so only release signatures must validate.
            if ($env:SIGNPATH_SIGNING_POLICY -eq 'release-signing' -and $signature.Status -ne 'Valid') {
              throw "$($file.Name) signature status is $($signature.Status)"
            }
            Write-Output "$($file.Name): signed by $($signature.SignerCertificate.Subject) ($($signature.Status))"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  prepare-release:
    needs:
      - plan
      - test
      - build
    # Release preparation requires every updater target.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          # Excludes the unsigned signpath-* uploads, which share release file names.
          pattern: artifacts-*
          path: ./artifacts

      - name: Materialize updater signing key
        env:
          UPDATER_PRIVATE_KEY_PEM: ${{ secrets.UPDATER_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$UPDATER_PRIVATE_KEY_PEM"
          umask 077
          printf '%s\n' "$UPDATER_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/updater.key"

      - name: Prepare signed updater manifest release asset
        env:
          UPDATER_ARTIFACTS_DIR: ./artifacts
          UPDATER_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
          UPDATER_PUBLIC_KEY: backend/updater_public_key.pem
        run: wails3 task release:prepare-updater-manifest

      - name: Remove updater signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/updater.key"

      - name: Validate prepared GitHub release without publishing
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_DRY_RUN: "true"
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: wails3 task release:app

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v7
        with:
          name: prepared-release-assets
          path: ./artifacts
          if-no-files-found: error

  release:
    if: ${{ github.event.inputs.release == 'true' || github.event_name == 'push' }}
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      RELEASE_DRY_RUN: "false"
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Download prepared release assets
        uses: actions/download-artifact@v8
        with:
          name: prepared-release-assets
          path: ./artifacts

      - name: Publish GitHub release
        run: |
          export GITHUB_RUN_NUMBER="${{ github.run_number }}"
          wails3 task release:app

  update-site:
    if: ${{ github.event.inputs.release == 'true' || github.event_name == 'push' }}
    needs:
      - release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Update version on website
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: wails3 task release:site
